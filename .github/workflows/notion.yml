name: GitHub → Groq → Notion

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar histórico do Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar sincronizador
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/jpDev05/.github-workflows-notion.yml/main/notion_sync.py \
            -o notion_sync.py

      - name: Documentar no Notion com Groq
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}

          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

        run: |
          test -n "$NOTION_TOKEN" || {
            echo "::error::NOTION_TOKEN não configurado"
            exit 1
          }

          test -n "$GROQ_API_KEY" || {
            echo "::error::GROQ_API_KEY não configurado"
            exit 1
          }

          python3 notion_sync.py
